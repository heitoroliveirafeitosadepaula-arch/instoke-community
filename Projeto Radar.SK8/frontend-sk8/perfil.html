<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Instoke</title>
    <style>
        :root {
            --verde-neon: #00ff55;
            --fundo-escuro: #050505;
            --fundo-card: #121212;
            --borda: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--fundo-escuro); color: #ffffff; padding-bottom: 50px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; border-bottom: 1px solid var(--borda);
            position: sticky; top: 0; background-color: var(--fundo-escuro); z-index: 10;
        }
        header h1 { color: var(--verde-neon); font-size: 1.5rem; font-weight: 900; }
        
        .btn-voltar, .btn-editar {
            background: transparent; color: #aaa; border: 1px solid #aaa; 
            padding: 8px 20px; border-radius: 20px; font-weight: bold; 
            cursor: pointer; text-decoration: none; transition: 0.3s;
        }
        .btn-voltar:hover { border-color: var(--verde-neon); color: var(--verde-neon); }
        .btn-editar { border-color: var(--verde-neon); color: var(--verde-neon); margin-left: 10px; }
        .btn-editar:hover { background: var(--verde-neon); color: #000; }

        main { display: flex; justify-content: center; padding: 40px 20px; }
        
        .perfil-container { width: 100%; max-width: 800px; }

        /* CABEÇALHO DO PERFIL */
        .header-insta { display: flex; align-items: center; gap: 40px; margin-bottom: 30px; }

        .foto-perfil {
            width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--verde-neon); flex-shrink: 0;
            background-color: #1a1a1a; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; overflow: hidden;
        }
        .foto-perfil img { width: 100%; height: 100%; object-fit: cover; }

        .info-superior { flex-grow: 1; }

        .nome-container { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .nome { font-size: 1.8rem; font-weight: 400; color: #fff; }
        
        /* ESTATÍSTICAS */
        .estatisticas { display: flex; gap: 30px; margin-bottom: 20px; font-size: 1.1rem; }
        .estatisticas span { color: #ccc; }
        .estatisticas strong { color: #fff; }

        /* BIOGRAFIA */
        .bio-area { font-size: 1rem; line-height: 1.5; color: #ddd; }
        .bio-area .local { color: #888; font-size: 0.9rem; margin-bottom: 5px; }
        
        .link-insta {
            display: inline-block; color: var(--verde-neon); text-decoration: none;
            font-weight: bold; margin-bottom: 10px;
        }
        .link-insta:hover { text-decoration: underline; }

        /* SEPARADOR DA GRELHA */
        .separador-grid {
            border-top: 1px solid var(--borda);
            display: flex; justify-content: center; margin-top: 40px;
        }
        .separador-grid span {
            border-top: 1px solid var(--verde-neon);
            padding: 15px 20px 0 20px; margin-top: -1px;
            font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; color: #fff;
        }

        /* GRELHA DE FOTOS */
        .grid-fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 20px; }

        .item-grid {
            aspect-ratio: 1 / 1; background-color: #1a1a1a; position: relative;
            cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .item-grid img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .item-grid:hover img { filter: brightness(0.7); transform: scale(1.05); }
        
        .icone-video { position: absolute; top: 10px; right: 10px; font-size: 1.5rem; }

        .msg-carregando { text-align: center; color: #888; font-size: 1.1rem; padding: 40px; }
        
        @media (max-width: 600px) {
            .header-insta { gap: 20px; }
            .foto-perfil { width: 100px; height: 100px; }
            .estatisticas { gap: 15px; font-size: 0.9rem; }
            .nome { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Instoke</h1>
        <a href="index.html" class="btn-voltar">← Voltar pro Feed</a>
    </header>

    <main>
        <div id="area-perfil" class="perfil-container">
            <p class="msg-carregando">A procurar dados do atleta... ⏳</p>
        </div>
    </main>

    <script>
        const API_URL = "http://192.168.1.6:3000"; // IP fixo para conexão Node.js/Express
        
        document.addEventListener('DOMContentLoaded', carregarPerfilCompleto);

        // FUNÇÃO PARA PUXAR A CAPA DO YOUTUBE
        function obterThumbnailVideo(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            if (match && match[2].length === 11) {
                return `https://img.youtube.com/vi/${match[2]}/hqdefault.jpg`;
            }
            return null;
        }

        async function carregarPerfilCompleto() {
            const container = document.getElementById('area-perfil');
            const parametrosUrl = new URLSearchParams(window.location.search);
            const idSkatista = parametrosUrl.get('id');

            // Verifica quem está logado
            const usuarioString = localStorage.getItem('usuarioLogado');
            let usuarioLogado = null;
            if (usuarioString) {
                usuarioLogado = JSON.parse(usuarioString);
            }

            if (!idSkatista) {
                container.innerHTML = '<p class="msg-carregando" style="color:#ff4500;">Nenhum atleta selecionado.</p>';
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }

            try {
                const [respostaPerfil, respostaMidias] = await Promise.all([
                    fetch(`${API_URL}/skatistas/${idSkatista}`),
                    fetch(`${API_URL}/skatistas/${idSkatista}/midias`)
                ]);
                
                if (!respostaPerfil.ok) throw new Error('Skatista não encontrado');
                
                const skatista = await respostaPerfil.json();
                const midias = await respostaMidias.json();

                let imgHtml = '🛹';
                if (skatista.foto_perfil) {
                    const imgSrc = skatista.foto_perfil.startsWith('data:image') 
                                    ? skatista.foto_perfil : `data:image/jpeg;base64,${skatista.foto_perfil}`;
                    imgHtml = `<img src="${imgSrc}" alt="${skatista.apelido || 'Skatista'}">`;
                }

                let linkInstaHtml = '';
                if (skatista.instagram_arroba) {
                    const arrobaLimpa = skatista.instagram_arroba.replace('@', '');
                    linkInstaHtml = `<a href="https://instagram.com/${arrobaLimpa}" target="_blank" class="link-insta">@${arrobaLimpa}</a><br>`;
                }

                let totalProps = skatista.curtidas || 0;
                midias.forEach(m => totalProps += m.curtidas || 0);

                let gridHtml = '';
                if (midias.length === 0) {
                    gridHtml = '<p class="msg-carregando" style="grid-column: 1 / -1;">Sem publicações no radar.</p>';
                } else {
                    midias.forEach(m => {
                        if (m.tipo === 'foto' && m.arquivo_base64) {
                            const imgMidia = m.arquivo_base64.startsWith('data:image') 
                                            ? m.arquivo_base64 : `data:image/jpeg;base64,${m.arquivo_base64}`;
                            gridHtml += `
                                <div class="item-grid" title="${m.legenda || ''}">
                                    <img src="${imgMidia}" alt="Post">
                                </div>`;
                        } else if (m.tipo === 'video' && m.url_video) {
                            const thumb = obterThumbnailVideo(m.url_video);
                            
                            if (thumb) {
                                // Grelha com a capa do YouTube e um ícone de play no canto
                                gridHtml += `
                                    <div class="item-grid" onclick="window.open('${m.url_video}', '_blank')" title="${m.legenda || ''}">
                                        <img src="${thumb}" alt="Vídeo YouTube">
                                        <div class="icone-video" style="background:rgba(0,0,0,0.7); border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:1rem; padding-left:2px; color:var(--verde-neon);">
                                            ▶
                                        </div>
                                    </div>`;
                            } else {
                                // Grelha com link genérico
                                gridHtml += `
                                    <div class="item-grid" onclick="window.open('${m.url_video}', '_blank')" title="${m.legenda || ''}" style="background: #222; flex-direction:column;">
                                        <div style="font-size: 2rem;">🔗</div>
                                        <span style="color:#aaa; font-weight:bold; font-size: 0.8rem; margin-top: 5px;">LINK</span>
                                    </div>`;
                            }
                        }
                    });
                }

                // Lógica de integração: Mostra botão editar apenas se o perfil for do skatista logado
                let botaoEditarHTML = '';
                if (usuarioLogado && String(usuarioLogado.id) === String(idSkatista)) {
                    botaoEditarHTML = `<a href="editar.perfil.html" class="btn-editar">Editar Perfil ⚙️</a>`;
                }

                container.innerHTML = `
                    <div class="header-insta">
                        <div class="foto-perfil">${imgHtml}</div>
                        <div class="info-superior">
                            <div class="nome-container">
                                <h2 class="nome">${skatista.apelido || skatista.nome_completo || 'Sem Nome'}</h2>
                                ${botaoEditarHTML}
                            </div>
                            <div class="estatisticas">
                                <span><strong>${midias.length}</strong> publicações</span>
                                <span><strong>${totalProps}</strong> props</span>
                                <span>Base: <strong>${skatista.base || 'N/A'}</strong></span>
                            </div>
                            <div class="bio-area">
                                ${linkInstaHtml}
                                <div class="local">📍 ${skatista.cidade_estado || 'Local desconhecido'}</div>
                                <div>${skatista.biografia || ''}</div>
                            </div>
                        </div>
                    </div>

                    <div class="separador-grid">
                        <span>POSTS</span>
                    </div>

                    <div class="grid-fotos">
                        ${gridHtml}
                    </div>
                `;

            } catch (erro) {
                console.error(erro);
                container.innerHTML = `
                    <p class="msg-carregando" style="color:#ff4500;">
                        Erro ao carregar o perfil.<br>Verifique se o backend e o MySQL estão ativos.
                    </p>`;
            }
        }
    </script>
</body>
</html>
