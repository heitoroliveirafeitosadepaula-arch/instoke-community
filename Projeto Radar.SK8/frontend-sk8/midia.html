<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instoke - Nova Mídia</title>
    <style>
        /* PALETA DE CORES INSTOKE */
        :root {
            --verde-neon: #00ff55;
            --fundo-escuro: #050505;
            --fundo-card: #121212;
            --borda: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--fundo-escuro); color: #ffffff; }

        header {
            display: flex; justify-content: flex-start; align-items: center;
            padding: 20px 40px; border-bottom: 1px solid var(--borda);
            background-color: var(--fundo-escuro); position: sticky; top: 0; z-index: 10; min-height: 80px;
        }
        
        header h1 {
            color: var(--verde-neon); font-size: 1.5rem; font-weight: 900; letter-spacing: 1px;
            margin: 0; position: absolute; left: 50%; transform: translateX(-50%);
        }

        .btn-voltar {
            background: transparent; color: #aaa; border: 1px solid #aaa; padding: 8px 20px; 
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; z-index: 20;
        }
        .btn-voltar:hover { border-color: var(--verde-neon); color: var(--verde-neon); }

        main { display: flex; justify-content: center; padding: 40px 20px; }

        .form-card { background-color: var(--fundo-card); border: 1px solid var(--borda); border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-card h2 { text-align: center; margin-bottom: 30px; color: #fff; font-size: 1.8rem; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-weight: bold; font-size: 0.9rem; }

        input[type="text"], select, textarea {
            width: 100%; padding: 12px 15px; background-color: #111; border: 1px solid #333;
            border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--verde-neon); }
        textarea { resize: vertical; min-height: 100px; }

        .tipo-midia-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-tipo { flex: 1; padding: 10px; background-color: #111; border: 1px solid #333; color: #888; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-tipo.ativo { background-color: rgba(0, 255, 85, 0.1); border-color: var(--verde-neon); color: var(--verde-neon); }

        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type="file"] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .btn-upload-falso { display: block; width: 100%; padding: 15px; background-color: #1a1a1a; border: 1px dashed #555; border-radius: 8px; text-align: center; color: #aaa; font-weight: bold; transition: 0.3s; }
        .file-upload-wrapper:hover .btn-upload-falso { border-color: var(--verde-neon); color: var(--verde-neon); }
        .preview-imagem { max-width: 100%; margin-top: 15px; border-radius: 8px; display: none; border: 1px solid #333; }

        .btn-submit { width: 100%; background-color: var(--verde-neon); color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: opacity 0.3s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.8; }
        #mensagem-sistema { text-align: center; margin-top: 15px; font-weight: bold; display: none; }

        .user-badge { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .user-badge img, .user-badge .placeholder-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--verde-neon); }
        .user-badge .placeholder-img { background: #333; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>Instoke</h1>
        <a href="/" class="btn-voltar">← Voltar pro Feed</a>
    </header>

    <main>
        <div class="form-card">
            <h2>Dropar Nova Mídia</h2>
            
            <form id="form-midia">
                <div class="user-badge" id="info-usuario-postando">
                    <div class="placeholder-img">S</div>
                    <p style="color: #aaa;" id="nome-usuario-logado">A carregar perfil... ⏳</p>
                </div>

                <!-- Campo oculto vital para o MySQL saber que é uma foto -->
                <input type="hidden" name="tipo" id="input-tipo" value="imagem">

                <div class="form-group">
                    <label>Tipo de conteúdo</label>
                    <div class="tipo-midia-container">
                        <button type="button" id="btn-foto" class="btn-tipo ativo" onclick="mudarAba('imagem')">📷 Postar Foto</button>
                        <button type="button" id="btn-video" class="btn-tipo" onclick="mudarAba('video')">🎬 Link de Vídeo</button>
                    </div>
                </div>

                <!-- CAMPO DE FOTO COM O ATRIBUTO NAME="ARQUIVO" VITAL PARA O MULTER -->
                <div id="area-foto" class="form-group">
                    <label>Escolher ficheiro</label>
                    <div class="file-upload-wrapper">
                        <input type="file" name="arquivo" id="input-foto" accept="image/*, video/*">
                        <div class="btn-upload-falso" id="texto-upload">Clique para selecionar uma foto (JPG, PNG)</div>
                    </div>
                    <img id="preview" class="preview-imagem" alt="Preview da imagem">
                </div>

                <!-- CAMPO DE VÍDEO (Escondido) COM NAME -->
                <div id="area-video" class="form-group" style="display: none;">
                    <label for="input-video">Link do Vídeo (YouTube, Instagram, etc)</label>
                    <input type="text" name="url_video" id="input-video" placeholder="Cole a URL do vídeo aqui...">
                </div>

                <!-- LEGENDA COM NAME -->
                <div class="form-group">
                    <label for="legenda">Legenda / Descrição</label>
                    <textarea name="legenda" id="legenda" placeholder="Fale um pouco sobre esse clique ou manobra..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Publicar no Instoke ⚡</button>
            </form>
        </div>
    </main>

    <script>
        // Função para carregar os dados do usuário na tela
        function carregarUsuario() {
            const usuarioJSON = localStorage.getItem('usuarioLogado');
            if (usuarioJSON) {
                const usuario = JSON.parse(usuarioJSON);
                document.getElementById('nome-usuario-logado').innerHTML = `<strong>${usuario.apelido || usuario.nome_completo}</strong><br><small>${usuario.cidade_estado}</small>`;
                if(usuario.foto_perfil) {
                    document.getElementById('info-usuario-postando').innerHTML = `<img src="${usuario.foto_perfil}" alt="Foto de ${usuario.apelido}"><p style="color: #aaa;"><strong>${usuario.apelido || usuario.nome_completo}</strong><br><small>${usuario.cidade_estado}</small></p>`;
                }
            }
        }
        carregarUsuario();

        // Lógica de Abas
        function mudarAba(aba) {
            document.getElementById('input-tipo').value = aba;
            if(aba === 'imagem') {
                document.getElementById('area-foto').style.display = 'block';
                document.getElementById('area-video').style.display = 'none';
                document.getElementById('btn-foto').classList.add('ativo');
                document.getElementById('btn-video').classList.remove('ativo');
                document.getElementById('input-foto').required = true;
            } else {
                document.getElementById('area-foto').style.display = 'none';
                document.getElementById('area-video').style.display = 'block';
                document.getElementById('btn-video').classList.add('ativo');
                document.getElementById('btn-foto').classList.remove('ativo');
                document.getElementById('input-foto').required = false;
            }
        }

        // Preview da foto selecionada
        document.getElementById('input-foto').addEventListener('change', function(e) {
            const arquivo = e.target.files[0];
            if (arquivo) {
                document.getElementById('texto-upload').innerText = arquivo.name;
                const reader = new FileReader();
                reader.onload = function(evento) {
                    const imgPreview = document.getElementById('preview');
                    imgPreview.src = evento.target.result;
                    imgPreview.style.display = 'block';
                }
                reader.readAsDataURL(arquivo);
            }
        });

        // Envio do post
        document.querySelector('form').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 

            const token = localStorage.getItem('tokenInstoke');
            if (!token) {
                alert("❌ Você precisa estar logado para postar!");
                window.location.href = "login.html";
                return;
            }

            const btn = document.querySelector('button[type="submit"]');
            const textoOriginal = btn.innerText;
            btn.innerText = "Enviando pro Feed... ⏳";
            btn.disabled = true;

            const formElement = evento.target;
            const formData = new FormData(formElement);

            try {
                const resposta = await fetch('/midias', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (resposta.ok) {
                    alert("✅ Postagem lançada no Radar com sucesso!");
                    window.location.href = "/"; 
                } else {
                    let erroMsg = "Sessão expirada ou inválida.";
                    try {
                        const resultado = await resposta.json();
                        if (resultado.erro) erroMsg = resultado.erro;
                    } catch(e) {}
                    
                    alert("❌ Erro: " + erroMsg);
                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                alert("❌ Erro ao conectar com o servidor.");
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
