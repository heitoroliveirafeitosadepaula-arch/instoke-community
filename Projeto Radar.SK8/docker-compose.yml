version: '3.8'

services:
  app:
    build: .
    container_name: stoke_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules # Mantém os módulos do container isolados
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=sua_senha_aqui
      - DB_NAME=stoke_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: stoke_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sua_senha_aqui
      MYSQL_DATABASE: stoke_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: