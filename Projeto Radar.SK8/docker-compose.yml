services:
  db:
    image: mysql:8.0
    container_name: stoke_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sua_senha_aqui
      MYSQL_DATABASE: stoke_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psua_senha_aqui"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: stoke_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=sua_senha_aqui
      - DB_NAME=stoke_db
      - JWT_SECRET=chave_secreta_sk8
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: